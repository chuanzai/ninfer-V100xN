# 把内嵌控制台挂到 ninfer-serve:8080 的 /console/。
# 启用（服务器 x99-d4 上，免密 sudo 可用）：
#   sudo mkdir -p /etc/systemd/system/ninfer-serve.service.d
#   sudo cp ninfer-serve-console.conf /etc/systemd/system/ninfer-serve.service.d/console.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart ninfer-serve      # 重启会写前缀归档，约 13s；首次请求退回冷预填
#   curl -s http://127.0.0.1:8080/console/ | head
# 撤销：删掉 console.conf 后 daemon-reload + restart。
#
# ExecStart 必须完整重写（systemd 里 ExecStart= 清空后再赋值）。
[Service]
ExecStart=
ExecStart=/home/chuanzai/ninfer-V100X2/build-v100/apps/ninfer-serve /home/chuanzai/Models/Qwen3.8-27B-QUASAR-NVFP4-NInfer-MirkoCovizzi/qwen3_8_27b_nvfp4.ninfer --host 0.0.0.0 --port 8080 --tp 2 --devices 0,1 --max-concurrency 2 --prefix-cache-tokens 589824 --pending-timeout-ms 600000 --vision --vision-device cpu --vision-max-tokens 24576 --max-context 262144 --kv-dtype int8 --prefill-chunk 2560 --spec mtp --draft-tokens 4 --lm-head-draft --volta-long-attention --default-max-tokens 65536 --request-log-jsonl profiles/serve.jsonl --log-stats-interval-ms 1000 --no-thinking --prefix-archive /home/chuanzai/ninfer-V100X2/state/prefix-archive.bin --prefix-archive-max-mib 4096 --console-dir /home/chuanzai/ninfer-V100X2/src/serve/console
